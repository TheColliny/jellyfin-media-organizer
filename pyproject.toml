[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-media-organizer"
version = "0.4.0"
description = "Cross-platform GUI for previewing and applying Jellyfin-friendly media organization."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "TheColliny" }]
keywords = ["jellyfin", "media", "organizer", "rename", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.7",
    "send2trash>=1.8.3",
]

[project.scripts]
jellyfin-organizer = "jellyfin_organizer.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jellyfin_organizer*"]

[tool.setuptools.package-data]
jellyfin_organizer = ["assets/*"]
